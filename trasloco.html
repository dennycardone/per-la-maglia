<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Per la Maglia</title>
<style>
  html, body { margin: 0; height: 100%; background: #05080e; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: .5px; }
  p { margin: 0 0 18px; color: rgba(255,255,255,.75); font-size: 15px; }
  a { display: inline-block; padding: 12px 22px; border-radius: 12px; background: #ffd23f; color: #05080e; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div>
  <h1>Per la Maglia ha una nuova casa</h1>
  <p>Ti portiamo su perlamaglia.com con il tuo nome, la tua squadra e i tuoi punti…</p>
  <a id="go" href="https://perlamaglia.com/">Vai a perlamaglia.com</a>
</div>
<script>
// The game moved from this address to perlamaglia.com. Browsers keep saved data per address,
// so the player's data is handed over once, in the part of the link that never reaches any server.
(function () {
  var NEW = "https://perlamaglia.com/", tail = location.search || "", data = {};
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (/^(pm\.|cucchiaio\.|pennellata\.)/.test(k) && k !== "cucchiaio.analytics") data[k] = localStorage.getItem(k);
    }
  } catch (e) {}
  var hash = "";
  try {
    if (Object.keys(data).length) {
      hash = "#trasloco=" + btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
  } catch (e) {}
  var target = NEW + tail + hash;
  document.getElementById("go").href = target;
  location.replace(target);
})();
</script>
</body>
</html>
